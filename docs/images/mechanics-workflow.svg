<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">SiteShield mechanics workflow</title>
  <desc id="desc">Learner workflow from module selection through observation, inspection, hands-on controls, coaching, scoring, and debrief.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07131d"/>
      <stop offset="1" stop-color="#112737"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#38e6e0"/>
      <stop offset="1" stop-color="#1688be"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffc64d"/>
      <stop offset="1" stop-color="#f36b38"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#75cbd7"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <path d="M0 150H1600M0 760H1600" stroke="#2a5365" stroke-opacity=".35"/>
  <text x="92" y="92" fill="#f3fbff" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="700" letter-spacing="3">SAFETY TRAINING MECHANICS</text>
  <text x="95" y="128" fill="#8eacb9" font-family="Arial, Helvetica, sans-serif" font-size="21" letter-spacing="1">DETERMINISTIC SAFETY ASSESSMENT + GROUNDED NPC COACHING</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(90 210)">
      <rect width="252" height="190" rx="22" fill="#0d2231" stroke="#43d7dc" stroke-width="3"/>
      <rect x="22" y="22" width="54" height="54" rx="14" fill="url(#cyan)"/>
      <text x="49" y="59" fill="#06202e" font-size="27" font-weight="700" text-anchor="middle">01</text>
      <text x="22" y="118" fill="#f6fdff" font-size="25" font-weight="700">SELECT A SITE</text>
      <text x="22" y="150" fill="#a7c4cf" font-size="18">Choose one of five</text>
      <text x="22" y="176" fill="#a7c4cf" font-size="18">isolated work zones.</text>
    </g>
    <g transform="translate(418 210)">
      <rect width="252" height="190" rx="22" fill="#0d2231" stroke="#43d7dc" stroke-width="3"/>
      <rect x="22" y="22" width="54" height="54" rx="14" fill="url(#cyan)"/>
      <text x="49" y="59" fill="#06202e" font-size="27" font-weight="700" text-anchor="middle">02</text>
      <text x="22" y="118" fill="#f6fdff" font-size="25" font-weight="700">OBSERVE</text>
      <text x="22" y="150" fill="#a7c4cf" font-size="18">Scan realistic props,</text>
      <text x="22" y="176" fill="#a7c4cf" font-size="18">routes, and controls.</text>
    </g>
    <g transform="translate(746 210)">
      <rect width="252" height="190" rx="22" fill="#0d2231" stroke="#43d7dc" stroke-width="3"/>
      <rect x="22" y="22" width="54" height="54" rx="14" fill="url(#cyan)"/>
      <text x="49" y="59" fill="#06202e" font-size="27" font-weight="700" text-anchor="middle">03</text>
      <text x="22" y="118" fill="#f6fdff" font-size="25" font-weight="700">INSPECT</text>
      <text x="22" y="150" fill="#a7c4cf" font-size="18">Hover, select, and</text>
      <text x="22" y="176" fill="#a7c4cf" font-size="18">classify conditions.</text>
    </g>
    <g transform="translate(1074 210)">
      <rect width="252" height="190" rx="22" fill="#0d2231" stroke="#ffc44c" stroke-width="3"/>
      <rect x="22" y="22" width="54" height="54" rx="14" fill="url(#orange)"/>
      <text x="49" y="59" fill="#3b1a02" font-size="27" font-weight="700" text-anchor="middle">04</text>
      <text x="22" y="118" fill="#f6fdff" font-size="25" font-weight="700">ACT HANDS-ON</text>
      <text x="22" y="150" fill="#a7c4cf" font-size="18">Grab, place, drag, or</text>
      <text x="22" y="176" fill="#a7c4cf" font-size="18">sequence safety controls.</text>
    </g>

    <path d="M342 305H408M670 305H736M998 305H1064" stroke="#75cbd7" stroke-width="5" marker-end="url(#arrow)"/>
    <text x="800" y="467" fill="#84dfe0" font-size="18" font-weight="700" letter-spacing="2" text-anchor="middle">LEARNER ACTION LOOP</text>
    <path d="M1326 305 C1450 305 1450 540 1268 540 H328 C190 540 190 305 90 305" fill="none" stroke="#4a7282" stroke-width="3" stroke-dasharray="10 12" marker-end="url(#arrow)"/>

    <g transform="translate(242 555)">
      <rect width="360" height="158" rx="22" fill="#102b37" stroke="#43d7dc" stroke-width="3"/>
      <text x="28" y="42" fill="#45e2df" font-size="18" font-weight="700" letter-spacing="2">ASSESSMENT ENGINE</text>
      <text x="28" y="82" fill="#f6fdff" font-size="25" font-weight="700">Score + feedback</text>
      <text x="28" y="113" fill="#a7c4cf" font-size="18">Correct hazard: +100</text>
      <text x="28" y="139" fill="#a7c4cf" font-size="18">Safe-condition miss: −25</text>
    </g>
    <g transform="translate(662 555)">
      <rect width="360" height="158" rx="22" fill="#102b37" stroke="#ffbb4b" stroke-width="3"/>
      <text x="28" y="42" fill="#ffbf4e" font-size="18" font-weight="700" letter-spacing="2">NPC SAFETY COACH</text>
      <text x="28" y="82" fill="#f6fdff" font-size="25" font-weight="700">Ask, prompt, explain</text>
      <text x="28" y="113" fill="#a7c4cf" font-size="18">Grounded chat response</text>
      <text x="28" y="139" fill="#a7c4cf" font-size="18">No authority over scoring</text>
    </g>
    <g transform="translate(1082 555)">
      <rect width="276" height="158" rx="22" fill="#102b37" stroke="#8da8ff" stroke-width="3"/>
      <text x="28" y="42" fill="#9eafff" font-size="18" font-weight="700" letter-spacing="2">DEBRIEF</text>
      <text x="28" y="82" fill="#f6fdff" font-size="25" font-weight="700">Review control</text>
      <text x="28" y="113" fill="#a7c4cf" font-size="18">Complete the site</text>
      <text x="28" y="139" fill="#a7c4cf" font-size="18">then choose next zone.</text>
    </g>
    <path d="M1118 400V535H422V545" fill="none" stroke="#75cbd7" stroke-width="5" marker-end="url(#arrow)"/>
    <path d="M602 634H652M1022 634H1072" stroke="#75cbd7" stroke-width="5" marker-end="url(#arrow)"/>
  </g>
  <rect x="90" y="800" width="1420" height="2" fill="#35d7da" filter="url(#glow)"/>
  <text x="90" y="845" fill="#9bb9c4" font-family="Arial, Helvetica, sans-serif" font-size="19">Five modules: Construction · Warehouse · Fire Response · Chemical Processing · Electrical Maintenance</text>
</svg>
